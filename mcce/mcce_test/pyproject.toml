[project]
name = "mcce-test"
version = "0.1.0"
description = "Deep validation harness for Multi-target Cut Cross Entropy (MCCE)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "triton>=3.1",
    "numpy>=2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -rA"
